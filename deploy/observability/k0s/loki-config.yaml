# Single-node local log store. The service is private; Grafana is the
# authenticated reader. Filesystem storage is tied to this k0s node.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info
  log_format: json

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /var/loki/tsdb-index
    cache_location: /var/loki/tsdb-cache

ingester:
  chunk_idle_period: 5m
  max_chunk_age: 1h
  wal:
    enabled: true
    dir: /var/loki/wal
    flush_on_shutdown: true

compactor:
  working_directory: /var/loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 2
  delete_request_store: filesystem

limits_config:
  retention_period: 48h
  max_query_lookback: 48h
  reject_old_samples: true
  reject_old_samples_max_age: 48h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  per_stream_rate_limit: 2MB
  per_stream_rate_limit_burst: 4MB
  max_global_streams_per_user: 5000
  # Preserve accepted lines intact. Oversized lines are rejected, not truncated.
  max_line_size: 1MB
  max_line_size_truncate: false
  max_query_parallelism: 4
  tsdb_max_query_parallelism: 4
  query_timeout: 1m

querier:
  max_concurrent: 2

frontend:
  max_outstanding_per_tenant: 128

analytics:
  reporting_enabled: false
