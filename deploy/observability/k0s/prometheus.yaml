# TSDB retention is bounded by age and size; WAL/head overhead is additional.
# Installer creates fleet-prometheus-rules from the shared ../alerts.yml. No remote-write or public ingress.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/part-of: fleet-observability
    app.kubernetes.io/name: prometheus
  namespace: fleet-observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: fleet-observability
        app.kubernetes.io/name: prometheus
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: quay.io/prometheus/prometheus:v3.15.0
        imagePullPolicy: IfNotPresent
        args:
        - "--config.file=/etc/prometheus/config/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        - "--storage.tsdb.retention.time=3d"
        - "--storage.tsdb.retention.size=3GB"
        - "--web.listen-address=0.0.0.0:9090"
        - "--query.max-concurrency=10"
        - "--query.timeout=30s"
        ports:
        - name: http
          containerPort: 9090
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1500m
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: "/prometheus"
        - name: config
          mountPath: "/etc/prometheus/config"
          readOnly: true
        - name: rules
          mountPath: "/etc/prometheus/rules"
          readOnly: true
        - name: tmp
          mountPath: "/tmp"
        startupProbe:
          httpGet:
            path: "/-/ready"
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: "/-/ready"
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: "/-/healthy"
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: data
        hostPath:
          path: "/var/lib/fleet-recall/observability/prometheus"
          type: DirectoryOrCreate
      - name: config
        configMap:
          name: prometheus-config
      - name: rules
        configMap:
          name: fleet-prometheus-rules
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      terminationGracePeriodSeconds: 60
      serviceAccountName: prometheus
      initContainers:
      - name: prepare-data
        image: busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - "-ec"
        - chown -R 65534:65534 /data
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - FOWNER
            - DAC_OVERRIDE
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: data
          mountPath: "/data"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/part-of: fleet-observability
    app.kubernetes.io/name: prometheus
  namespace: fleet-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
