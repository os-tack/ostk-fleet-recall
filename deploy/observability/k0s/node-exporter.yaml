# Host networking/PID plus read-only host mounts are required for node-level metrics.
# This is not privileged, but NetworkPolicy cannot reliably isolate hostNetwork traffic: keep VM/node port 9100 private.
# UID 10001 matches the worker so its mode-0600 snapshot can be read without loosening file permissions.
# Only the dedicated worker directory is chowned; no existing snapshot is rewritten.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  labels:
    app.kubernetes.io/part-of: fleet-observability
    app.kubernetes.io/name: node-exporter
  namespace: fleet-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: fleet-observability
        app.kubernetes.io/name: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      automountServiceAccountToken: false
      tolerations:
      - operator: Exists
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: prepare-data
        image: busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - "-ec"
        - chown 10001:10001 /worker
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - FOWNER
            - DAC_OVERRIDE
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: worker
          mountPath: "/worker"
      containers:
      - name: node-exporter
        image: quay.io/prometheus/node-exporter:v1.12.1
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        args:
        - "--web.listen-address=$(HOST_IP):9100"
        - "--path.procfs=/host/proc"
        - "--path.sysfs=/host/sys"
        - "--path.rootfs=/host/root"
        - "--collector.textfile.directory=/worker"
        - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/k0s/containerd/.+|run/k0s/containerd/.+)($|/)"
        env:
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        ports:
        - name: metrics
          containerPort: 9100
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: "/"
            port: metrics
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: "/"
            port: metrics
          periodSeconds: 15
        volumeMounts:
        - name: proc
          mountPath: "/host/proc"
          readOnly: true
        - name: sys
          mountPath: "/host/sys"
          readOnly: true
        - name: root
          mountPath: "/host/root"
          readOnly: true
          mountPropagation: HostToContainer
        - name: worker
          mountPath: "/worker"
          readOnly: true
      volumes:
      - name: proc
        hostPath:
          path: "/proc"
          type: Directory
      - name: sys
        hostPath:
          path: "/sys"
          type: Directory
      - name: root
        hostPath:
          path: "/"
          type: Directory
      - name: worker
        hostPath:
          path: "/var/lib/fleet-recall/observability/worker"
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  labels:
    app.kubernetes.io/part-of: fleet-observability
    app.kubernetes.io/name: node-exporter
  namespace: fleet-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: node-exporter
  ports:
  - name: metrics
    port: 9100
    targetPort: metrics
