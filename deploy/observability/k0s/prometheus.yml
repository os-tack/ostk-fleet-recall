# Only live-process counters are rate-able. Worker snapshots are a separate scrape job.
# Kubelet/cAdvisor use the Kubernetes API proxy with CA validation and a scoped service-account token.
# KSM workload deployment names become workload_deployment; deployment always identifies the environment.
# Application opt-in: prometheus.io/scrape="true", a named metrics container port (9091 by default), optional prometheus.io/port and /path.
---
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
rule_files:
- "/etc/prometheus/rules/*.yml"
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - 127.0.0.1:9090
    labels:
      cluster: k0s
      deployment: local-k0s
- job_name: kubernetes-apiserver
  static_configs:
  - targets:
    - kubernetes.default.svc:443
    labels:
      cluster: k0s
      deployment: local-k0s
  scheme: https
  authorization:
    credentials_file: "/var/run/secrets/kubernetes.io/serviceaccount/token"
  tls_config:
    ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    server_name: kubernetes.default.svc
- job_name: kubernetes-nodes
  scheme: https
  authorization:
    credentials_file: "/var/run/secrets/kubernetes.io/serviceaccount/token"
  tls_config:
    ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    server_name: kubernetes.default.svc
  kubernetes_sd_configs:
  - role: node
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: node
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: instance
  - target_label: __address__
    replacement: kubernetes.default.svc:443
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: __metrics_path__
    replacement: "/api/v1/nodes/$1/proxy/metrics"
  - target_label: cluster
    replacement: k0s
  - target_label: deployment
    replacement: local-k0s
- job_name: kubernetes-cadvisor
  scheme: https
  authorization:
    credentials_file: "/var/run/secrets/kubernetes.io/serviceaccount/token"
  tls_config:
    ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    server_name: kubernetes.default.svc
  kubernetes_sd_configs:
  - role: node
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: node
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: instance
  - target_label: __address__
    replacement: kubernetes.default.svc:443
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: __metrics_path__
    replacement: "/api/v1/nodes/$1/proxy/metrics/cadvisor"
  - target_label: cluster
    replacement: k0s
  - target_label: deployment
    replacement: local-k0s
- job_name: kube-state-metrics
  static_configs:
  - targets:
    - kube-state-metrics.fleet-observability.svc:8080
    labels:
      cluster: k0s
      deployment: local-k0s
  honor_labels: false
  metric_relabel_configs:
  - source_labels:
    - exported_deployment
    regex: "(.+)"
    target_label: workload_deployment
  - action: labeldrop
    regex: exported_deployment
- job_name: node-exporter
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - fleet-observability
    selectors:
    - role: pod
      label: app.kubernetes.io/name=node-exporter
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_phase
    action: keep
    regex: Running
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    action: keep
    regex: metrics
  - source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: node
  - source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: instance
    replacement: "$1:9100"
  - target_label: cluster
    replacement: k0s
  - target_label: deployment
    replacement: local-k0s
  metric_relabel_configs:
  - source_labels:
    - __name__
    action: drop
    regex: fleet_recall_.*
- job_name: fleet-worker-textfile
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - fleet-observability
    selectors:
    - role: pod
      label: app.kubernetes.io/name=node-exporter
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_phase
    action: keep
    regex: Running
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    action: keep
    regex: metrics
  - source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: node
  - source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: instance
    replacement: "$1:9100"
  - target_label: cluster
    replacement: k0s
  - target_label: deployment
    replacement: local-k0s
  - target_label: role
    replacement: worker
  metric_relabel_configs:
  - source_labels:
    - __name__
    action: keep
    regex: fleet_recall_.*|node_textfile_scrape_error
- job_name: fleet-recall
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - fleet-recall
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_annotation_prometheus_io_scrape
    action: keep
    regex: 'true'
  - source_labels:
    - __meta_kubernetes_pod_phase
    action: keep
    regex: Running
  - source_labels:
    - __meta_kubernetes_pod_container_init
    action: drop
    regex: 'true'
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    action: keep
    regex: metrics
  - source_labels:
    - __address__
    - __meta_kubernetes_pod_annotation_prometheus_io_port
    regex: "(.+):[0-9]+;([0-9]+)"
    replacement: "$1:$2"
    target_label: __address__
  - source_labels:
    - __meta_kubernetes_pod_annotation_prometheus_io_path
    regex: "(/.+)"
    target_label: __metrics_path__
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: node
  - source_labels:
    - __meta_kubernetes_pod_label_app
    target_label: app
  - source_labels:
    - __meta_kubernetes_pod_label_app_kubernetes_io_name
    regex: "(.+)"
    target_label: app
  - source_labels:
    - app
    target_label: role
  - target_label: cluster
    replacement: k0s
  - target_label: deployment
    replacement: local-k0s
- job_name: loki
  static_configs:
  - targets:
    - loki.fleet-observability.svc:3100
    labels:
      cluster: k0s
      deployment: local-k0s
- job_name: alloy
  static_configs:
  - targets:
    - alloy.fleet-observability.svc:12345
    labels:
      cluster: k0s
      deployment: local-k0s
- job_name: grafana
  static_configs:
  - targets:
    - grafana.fleet-observability.svc:3000
    labels:
      cluster: k0s
      deployment: local-k0s
