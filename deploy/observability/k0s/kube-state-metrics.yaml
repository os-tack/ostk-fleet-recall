# No arbitrary Kubernetes label/annotation allowlist: names and status only.
# Resources match the read-only RBAC allowlist; secrets are excluded.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/part-of: fleet-observability
    app.kubernetes.io/name: kube-state-metrics
  namespace: fleet-observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: fleet-observability
        app.kubernetes.io/name: kube-state-metrics
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kube-state-metrics
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
        imagePullPolicy: IfNotPresent
        args:
        - "--port=8080"
        - "--telemetry-port=8081"
        - "--namespaces=fleet-recall,ory,localstack,kube-system,fleet-observability"
        - "--resources=cronjobs,daemonsets,deployments,jobs,namespaces,nodes,persistentvolumeclaims,persistentvolumes,pods,replicasets,statefulsets"
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts: []
        readinessProbe:
          httpGet:
            path: "/healthz"
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: "/healthz"
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes: []
      terminationGracePeriodSeconds: 60
      serviceAccountName: kube-state-metrics
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/part-of: fleet-observability
    app.kubernetes.io/name: kube-state-metrics
  namespace: fleet-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
  - name: http
    port: 8080
    targetPort: http
