rule_files:
- alerts.yml
- k0s-alerts.yml
- remote-alerts.yml
evaluation_interval: 1m
tests:
- name: readiness has a hold and clears after recovery
  interval: 1m
  input_series:
  - series: fleet_recall_ready{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="recall:9091"}
    values: 0+0x3 1+0x3
  alert_rule_test:
  - eval_time: 0m
    alertname: FleetRemoteNotReady
    exp_alerts: []
  - eval_time: 1m
    alertname: FleetRemoteNotReady
    exp_alerts:
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        job: fleet-recall
        app: recall
        instance: recall:9091
        severity: warning
      exp_annotations:
        summary: Remote Recall readiness is failed or unobserved
        description: Inspect the bounded database readiness check and scrape health. Listener liveness and embedding
          availability do not establish core readiness.
  - eval_time: 4m
    alertname: FleetRemoteNotReady
    exp_alerts: []
- name: missing targets and missing readiness fail visibly
  interval: 1m
  input_series: []
  alert_rule_test:
  - eval_time: 1m
    alertname: FleetRemoteNotReady
    exp_alerts:
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        job: fleet-recall
        app: recall
        severity: warning
      exp_annotations:
        summary: Remote Recall readiness is failed or unobserved
        description: Inspect the bounded database readiness check and scrape health. Listener liveness and embedding
          availability do not establish core readiness.
  - eval_time: 2m
    alertname: FleetRemoteMetricsUnavailable
    exp_alerts:
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        job: fleet-edge
        severity: warning
      exp_annotations:
        summary: Remote plane metrics are unavailable for fleet-edge
        description: Check the private metrics listener, pod discovery, scoped RBAC and network policy. Missing
          targets are not healthy zero traffic.
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        job: fleet-cert-manager
        severity: warning
      exp_annotations:
        summary: Remote plane metrics are unavailable for fleet-cert-manager
        description: Check the private metrics listener, pod discovery, scoped RBAC and network policy. Missing
          targets are not healthy zero traffic.
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        job: fleet-recall
        app: recall
        severity: warning
      exp_annotations:
        summary: Remote plane metrics are unavailable for fleet-recall
        description: Check the private metrics listener, pod discovery, scoped RBAC and network policy. Missing
          targets are not healthy zero traffic.
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        job: fleet-worker-textfile
        severity: warning
      exp_annotations:
        summary: Remote plane metrics are unavailable for fleet-worker-textfile
        description: Check the private metrics listener, pod discovery, scoped RBAC and network policy. Missing
          targets are not healthy zero traffic.
  - eval_time: 5m
    alertname: FleetRemoteCertificateMetricsMissing
    exp_alerts:
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        job: fleet-edge
        severity: warning
      exp_annotations:
        summary: Fleet HTTPS certificate expiry is unobserved
        description: Check both private scrape jobs, Certificate existence and gateway certificate loading. An absent
          expiry series is not a valid or renewed certificate.
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        job: fleet-cert-manager
        namespace: fleet-edge
        name: fleet-edge
        severity: warning
      exp_annotations:
        summary: Fleet HTTPS certificate expiry is unobserved
        description: Check both private scrape jobs, Certificate existence and gateway certificate loading. An absent
          expiry series is not a valid or renewed certificate.
- name: a present but down edge is different from missing peers
  interval: 1m
  input_series:
  - series: up{cluster="k0s",deployment="local-k0s",job="fleet-edge",instance="edge:9100"}
    values: 0+0x3
  - series: up{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="recall:9091"}
    values: 1+0x3
  - series: up{cluster="k0s",deployment="local-k0s",job="fleet-cert-manager",instance="cert:9402"}
    values: 1+0x3
  - series: up{cluster="k0s",deployment="local-k0s",job="fleet-worker-textfile",instance="node:9100"}
    values: 1+0x3
  alert_rule_test:
  - eval_time: 1m
    alertname: FleetRemoteMetricsUnavailable
    exp_alerts: []
  - eval_time: 2m
    alertname: FleetRemoteMetricsUnavailable
    exp_alerts:
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        job: fleet-edge
        instance: edge:9100
        severity: warning
      exp_annotations:
        summary: Remote plane metrics are unavailable for fleet-edge
        description: Check the private metrics listener, pod discovery, scoped RBAC and network policy. Missing
          targets are not healthy zero traffic.
- name: HTTP errors require a traffic floor ratio and hold
  interval: 1m
  input_series:
  - series: fleet_recall_units_total{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="high",component="http_mcp",operation="mcp",unit="responses_5xx"}
    values: 0+3x12
  - series: fleet_recall_units_total{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="high",component="http_mcp",operation="mcp",unit="responses_2xx"}
    values: 0+7x12
  - series: fleet_recall_units_total{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="boundary",component="http_mcp",operation="mcp",unit="responses_5xx"}
    values: 0+1x12
  - series: fleet_recall_units_total{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="boundary",component="http_mcp",operation="mcp",unit="responses_2xx"}
    values: 0+19x12
  - series: fleet_recall_units_total{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="low",component="http_mcp",operation="mcp",unit="responses_5xx"}
    values: 0+0.5x12
  - series: fleet_recall_units_total{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="low",component="http_mcp",operation="mcp",unit="responses_2xx"}
    values: 0+0x12
  alert_rule_test:
  - eval_time: 1m
    alertname: FleetRemoteHttpErrors
    exp_alerts: []
  - eval_time: 8m
    alertname: FleetRemoteHttpErrors
    exp_alerts:
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        instance: high
        operation: mcp
        severity: warning
      exp_annotations:
        summary: Remote HTTP 5xx errors exceed 5% for mcp
        description: At least five 5xx responses occurred in five minutes. Inspect readiness, database and dependency
          failures; this measures the HTTP boundary, not tool-level errors inside HTTP 200.
- name: denials have independent policy thresholds
  interval: 1m
  input_series:
  - series: fleet_recall_operations_total{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="high",component="http_mcp",operation="grant",outcome="refused"}
    values: 0+10x12
  - series: fleet_recall_operations_total{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="high",component="http_mcp",operation="grant",outcome="success"}
    values: 0+30x12
  - series: fleet_recall_operations_total{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="boundary",component="http_mcp",operation="grant",outcome="refused"}
    values: 0+4x12
  - series: fleet_recall_operations_total{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="boundary",component="http_mcp",operation="grant",outcome="success"}
    values: 0+16x12
  - series: fleet_recall_operations_total{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="low",component="http_mcp",operation="grant",outcome="refused"}
    values: 0+1x12
  - series: fleet_recall_operations_total{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="low",component="http_mcp",operation="grant",outcome="success"}
    values: 0+0x12
  alert_rule_test:
  - eval_time: 4m
    alertname: FleetRemoteDenialRate
    exp_alerts: []
  - eval_time: 12m
    alertname: FleetRemoteDenialRate
    exp_alerts:
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        instance: high
        operation: grant
        severity: warning
      exp_annotations:
        summary: Remote HTTP denials exceed 20% for grant
        description: At least twenty 401/403/429 responses occurred in five minutes. Check client authorization,
          expiry and rate limits; expected OAuth challenges and negative tests can also contribute. No identity
          or token is a metric label.
- name: gateway errors include Ory upstream failures
  interval: 1m
  input_series:
  - series: traefik_entrypoint_requests_total{cluster="k0s",deployment="local-k0s",job="fleet-edge",instance="edge:9100",entrypoint="websecure",code="503",method="GET"}
    values: 0+3x10
  - series: traefik_entrypoint_requests_total{cluster="k0s",deployment="local-k0s",job="fleet-edge",instance="edge:9100",entrypoint="websecure",code="200",method="GET"}
    values: 0+7x10
  alert_rule_test:
  - eval_time: 1m
    alertname: FleetRemoteEdgeErrors
    exp_alerts: []
  - eval_time: 8m
    alertname: FleetRemoteEdgeErrors
    exp_alerts:
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        instance: edge:9100
        severity: warning
      exp_annotations:
        summary: HTTPS gateway 5xx errors exceed 5%
        description: At least five errors occurred in five minutes. Compare Recall HTTP errors with Ory and gateway
          health; this includes every canonical public service.
- name: spool counters retain first refusal and recover when quiet
  interval: 1m
  input_series:
  - series: fleet_recall_units_total{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="recall:9091",component="transcript",operation="receive",unit="quota_rejected"}
    values: 0 0 1+0x10
  - series: fleet_recall_units_total{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="recall:9091",component="transcript",operation="receive",unit="io_errors"}
    values: 0 0 1+0x10
  alert_rule_test:
  - eval_time: 1m
    alertname: FleetRemoteSpoolRejected
    exp_alerts: []
  - eval_time: 2m
    alertname: FleetRemoteSpoolRejected
    exp_alerts:
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        instance: recall:9091
        unit: quota_rejected
        severity: warning
      exp_annotations:
        summary: Transcript receiver reported quota_rejected
        description: Inspect scope/file quotas, spool permissions, lock contention and backing filesystem capacity
          using protected operational tools. Quota refusal is not evidence of disk exhaustion. Never delete evidence
          merely to clear an alert.
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        instance: recall:9091
        unit: io_errors
        severity: warning
      exp_annotations:
        summary: Transcript receiver reported io_errors
        description: Inspect scope/file quotas, spool permissions, lock contention and backing filesystem capacity
          using protected operational tools. Quota refusal is not evidence of disk exhaustion. Never delete evidence
          merely to clear an alert.
  - eval_time: 8m
    alertname: FleetRemoteSpoolRejected
    exp_alerts: []
- name: spool instrumentation is required even with no traffic
  interval: 1m
  input_series:
  - series: up{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="recall:9091"}
    values: 1+0x8
  - series: fleet_recall_units_total{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="recall:9091",component="transcript",operation="receive",unit="quota_rejected"}
    values: _x6 0+0x2
  alert_rule_test:
  - eval_time: 4m
    alertname: FleetRemoteSpoolMetricsMissing
    exp_alerts: []
  - eval_time: 5m
    alertname: FleetRemoteSpoolMetricsMissing
    exp_alerts:
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        job: fleet-recall
        app: recall
        instance: recall:9091
        severity: warning
      exp_annotations:
        summary: Transcript receiver metrics are missing
        description: Confirm the remote image contains spool telemetry and the transcript receiver is configured.
          Its counters initialize to zero before requests arrive.
  - eval_time: 6m
    alertname: FleetRemoteSpoolMetricsMissing
    exp_alerts: []
- name: certificate renewal clears expiry alerts
  interval: 1m
  input_series:
  - series: certmanager_certificate_expiration_timestamp_seconds{cluster="k0s",deployment="local-k0s",job="fleet-cert-manager",instance="cert:9402",namespace="fleet-edge",name="fleet-edge"}
    values: 86400+0x5 2592000+0x2
  - series: traefik_tls_certs_not_after{cluster="k0s",deployment="local-k0s",job="fleet-edge",instance="edge:9100",cn="",sans="auth.fleet.test,login.fleet.test,recall.fleet.test"}
    values: 518400+0x5 2592000+0x2
  alert_rule_test:
  - eval_time: 4m
    alertname: FleetRemoteCertificateExpiring
    exp_alerts: []
  - eval_time: 5m
    alertname: FleetRemoteCertificateExpiring
    exp_alerts:
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        job: fleet-cert-manager
        instance: cert:9402
        namespace: fleet-edge
        name: fleet-edge
        severity: warning
      exp_annotations:
        summary: Fleet HTTPS certificate expires within fourteen days
        description: Automatic renewal should begin thirty days before expiry. Inspect Certificate conditions, issuer
          validity and controller logs, then verify the served certificate. Preserve the pinned CA; do not disable
          verification.
  - eval_time: 6m
    alertname: FleetRemoteCertificateExpiring
    exp_alerts: []
  - eval_time: 5m
    alertname: FleetRemoteServedCertificateExpiring
    exp_alerts:
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        instance: edge:9100
        severity: critical
      exp_annotations:
        summary: A certificate loaded by the HTTPS gateway expires within seven days
        description: Compare the served chain with the renewed Secret and check Gateway reload. This private gauge
          covers loaded certificates; verify all three canonical names with the trusted TLS probe.
  - eval_time: 6m
    alertname: FleetRemoteServedCertificateExpiring
    exp_alerts: []
  - eval_time: 6m
    alertname: FleetRemoteCertificateMetricsMissing
    exp_alerts: []
- name: capacity covers bytes and inodes while excluding readonly filesystems
  interval: 1m
  input_series:
  - series: node_filesystem_files_free{cluster="k0s",deployment="local-k0s",job="node-exporter",instance="node:9100",node="lima-k0s",mountpoint="/",fstype="ext4",device="/"}
    values: 5+0x12
  - series: node_filesystem_files{cluster="k0s",deployment="local-k0s",job="node-exporter",instance="node:9100",node="lima-k0s",mountpoint="/",fstype="ext4",device="/"}
    values: 100+0x12
  - series: node_filesystem_avail_bytes{cluster="k0s",deployment="local-k0s",job="node-exporter",instance="node:9100",node="lima-k0s",mountpoint="/",fstype="ext4",device="/"}
    values: 5+0x12
  - series: node_filesystem_size_bytes{cluster="k0s",deployment="local-k0s",job="node-exporter",instance="node:9100",node="lima-k0s",mountpoint="/",fstype="ext4",device="/"}
    values: 100+0x12
  - series: node_filesystem_readonly{cluster="k0s",deployment="local-k0s",job="node-exporter",instance="node:9100",node="lima-k0s",mountpoint="/",fstype="ext4",device="/"}
    values: 0+0x12
  - series: node_filesystem_files_free{cluster="k0s",deployment="local-k0s",job="node-exporter",instance="node:9100",node="lima-k0s",mountpoint="/healthy",fstype="ext4",device="/healthy"}
    values: 20+0x12
  - series: node_filesystem_files{cluster="k0s",deployment="local-k0s",job="node-exporter",instance="node:9100",node="lima-k0s",mountpoint="/healthy",fstype="ext4",device="/healthy"}
    values: 100+0x12
  - series: node_filesystem_avail_bytes{cluster="k0s",deployment="local-k0s",job="node-exporter",instance="node:9100",node="lima-k0s",mountpoint="/healthy",fstype="ext4",device="/healthy"}
    values: 20+0x12
  - series: node_filesystem_size_bytes{cluster="k0s",deployment="local-k0s",job="node-exporter",instance="node:9100",node="lima-k0s",mountpoint="/healthy",fstype="ext4",device="/healthy"}
    values: 100+0x12
  - series: node_filesystem_readonly{cluster="k0s",deployment="local-k0s",job="node-exporter",instance="node:9100",node="lima-k0s",mountpoint="/healthy",fstype="ext4",device="/healthy"}
    values: 0+0x12
  - series: node_filesystem_files_free{cluster="k0s",deployment="local-k0s",job="node-exporter",instance="node:9100",node="lima-k0s",mountpoint="/readonly",fstype="ext4",device="/readonly"}
    values: 5+0x12
  - series: node_filesystem_files{cluster="k0s",deployment="local-k0s",job="node-exporter",instance="node:9100",node="lima-k0s",mountpoint="/readonly",fstype="ext4",device="/readonly"}
    values: 100+0x12
  - series: node_filesystem_avail_bytes{cluster="k0s",deployment="local-k0s",job="node-exporter",instance="node:9100",node="lima-k0s",mountpoint="/readonly",fstype="ext4",device="/readonly"}
    values: 5+0x12
  - series: node_filesystem_size_bytes{cluster="k0s",deployment="local-k0s",job="node-exporter",instance="node:9100",node="lima-k0s",mountpoint="/readonly",fstype="ext4",device="/readonly"}
    values: 100+0x12
  - series: node_filesystem_readonly{cluster="k0s",deployment="local-k0s",job="node-exporter",instance="node:9100",node="lima-k0s",mountpoint="/readonly",fstype="ext4",device="/readonly"}
    values: 1+0x12
  alert_rule_test:
  - eval_time: 9m
    alertname: FleetRemoteFilesystemInodesLow
    exp_alerts: []
  - eval_time: 10m
    alertname: FleetRemoteFilesystemInodesLow
    exp_alerts:
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        job: node-exporter
        instance: node:9100
        node: lima-k0s
        mountpoint: /
        fstype: ext4
        device: /
        severity: warning
      exp_annotations:
        summary: k0s filesystem / has under 10% free inodes
        description: Transcript spool, database, metrics and logs share VM storage. Check inode pressure alongside
          FleetK0sFilesystemLowAvailable; the declared hostPath PV size is not enforced capacity.
  - eval_time: 10m
    alertname: FleetK0sFilesystemLowAvailable
    exp_alerts:
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        job: node-exporter
        instance: node:9100
        node: lima-k0s
        mountpoint: /
        fstype: ext4
        device: /
        severity: warning
      exp_annotations:
        summary: k0s filesystem lima-k0s:/ has under 10% available
        description: Check persistent storage, image/cache growth, and metrics/log retention. Virtual, pod-local,
          and read-only mounts are excluded; bind mounts must not be summed as separate capacity.
- name: two missed ticks include measured runtime and clear on replacement
  interval: 1m
  input_series:
  - series: fleet_recall_snapshot_time_seconds{cluster="k0s",deployment="local-k0s",job="fleet-worker-textfile",instance="worker:9100"}
    values: 0+0x15 960+0x2
  - series: fleet_recall_operation_duration_seconds_sum{cluster="k0s",deployment="local-k0s",job="fleet-worker-textfile",instance="worker:9100",component="process",operation="worker"}
    values: 180+0x18
  - series: fleet_recall_operation_duration_seconds_count{cluster="k0s",deployment="local-k0s",job="fleet-worker-textfile",instance="worker:9100",component="process",operation="worker"}
    values: 1+0x18
  alert_rule_test:
  - eval_time: 13m
    alertname: FleetRecallWorkerSnapshotStale
    exp_alerts: []
  - eval_time: 14m
    alertname: FleetRecallWorkerSnapshotStale
    exp_alerts: []
  - eval_time: 15m
    alertname: FleetRecallWorkerSnapshotStale
    exp_alerts:
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        job: fleet-worker-textfile
        instance: worker:9100
        severity: warning
      exp_annotations:
        summary: Worker snapshot exceeded two ticks plus its duration allowance
        description: The five-minute schedule allows 600 seconds plus the last measured runtime (minimum 60 seconds),
          then a one-minute alert hold. Legacy snapshots without duration allow 900 seconds. Check scheduling, termination,
          export errors and permissions.
  - eval_time: 16m
    alertname: FleetRecallWorkerSnapshotStale
    exp_alerts: []
  promql_expr_test:
  - expr: fleet_recall_worker_snapshot_max_age_seconds
    eval_time: 1m
    exp_samples:
    - labels: fleet_recall_worker_snapshot_max_age_seconds{cluster="k0s",deployment="local-k0s",job="fleet-worker-textfile",instance="worker:9100"}
      value: 780
- name: one healthy peer cannot hide another missing instrument
  interval: 1m
  input_series:
  - series: up{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="missing:9091"}
    values: 1+0x6
  - series: fleet_recall_ready{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="healthy:9091"}
    values: 1+0x6
  - series: up{cluster="k0s",deployment="local-k0s",job="fleet-recall",app="recall",instance="healthy:9091"}
    values: 1+0x6
  - series: up{cluster="k0s",deployment="local-k0s",job="fleet-edge",instance="missing:9100"}
    values: 1+0x6
  - series: traefik_tls_certs_not_after{cluster="k0s",deployment="local-k0s",job="fleet-edge",instance="healthy:9100"}
    values: 2592000+0x6
  - series: certmanager_certificate_expiration_timestamp_seconds{cluster="k0s",deployment="local-k0s",job="fleet-cert-manager",instance="cert:9402",namespace="fleet-edge",name="fleet-edge"}
    values: 2592000+0x6
  alert_rule_test:
  - eval_time: 1m
    alertname: FleetRemoteNotReady
    exp_alerts:
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        job: fleet-recall
        app: recall
        instance: missing:9091
        severity: warning
      exp_annotations:
        summary: Remote Recall readiness is failed or unobserved
        description: Inspect the bounded database readiness check and scrape health. Listener liveness and embedding
          availability do not establish core readiness.
  - eval_time: 5m
    alertname: FleetRemoteCertificateMetricsMissing
    exp_alerts:
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        job: fleet-edge
        instance: missing:9100
        severity: warning
      exp_annotations:
        summary: Fleet HTTPS certificate expiry is unobserved
        description: Check both private scrape jobs, Certificate existence and gateway certificate loading. An absent
          expiry series is not a valid or renewed certificate.
- name: fixed dependency failure holds and recovers
  interval: 1m
  input_series:
  - series: fleet_dependency_probe_success{cluster="k0s",deployment="local-k0s",job="fleet-remote-probes",instance="node:9100",target="issuer_discovery"}
    values: 0+0x2 1+0x4
  alert_rule_test:
  - eval_time: 0m
    alertname: FleetRemoteDependencyUnavailable
    exp_alerts: []
  - eval_time: 1m
    alertname: FleetRemoteDependencyUnavailable
    exp_alerts:
    - exp_labels:
        cluster: k0s
        deployment: local-k0s
        job: fleet-remote-probes
        instance: node:9100
        target: issuer_discovery
        severity: warning
      exp_annotations:
        summary: 'Remote dependency probe failed: issuer_discovery'
        description: The fixed tokenless probe failed canonical issuer discovery/JWKS validation or the protected
          embedding listener check. Check DNS, TLS, gateway and service health. Core Recall readiness remains independent.
  - eval_time: 3m
    alertname: FleetRemoteDependencyUnavailable
    exp_alerts: []
- name: old dependency success is stale then clears on completion
  interval: 1m
  input_series:
  - series: fleet_dependency_probe_completed_timestamp_seconds{cluster="k0s",deployment="local-k0s",job="fleet-remote-probes",instance="node:9100",target="issuer_discovery"}
    values: 0+0x5 360+60x3
  alert_rule_test:
  - eval_time: 3m
    alertname: FleetRemoteDependencyProbeStale
    exp_alerts: []
  - eval_time: 4m
    alertname: FleetRemoteDependencyProbeStale
    exp_alerts: []
  - eval_time: 5m
    alertname: FleetRemoteDependencyProbeStale
