  labels:
    app.kubernetes.io/part-of: fleet-observability
  namespace: fleet-pki
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fleet-observability-prometheus-pods
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: fleet-observability
