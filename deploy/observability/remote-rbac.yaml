# HTTPS profile only: pod discovery grants no Secret access.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-prometheus-discovery
  labels:
    app.kubernetes.io/part-of: fleet-observability
  namespace: fleet-edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fleet-observability-prometheus-pods
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: fleet-observability
---
apiVersion: rbac.authorization.k8s.io/v1
