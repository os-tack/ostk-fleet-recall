# The private webhook receiver. Its environment must contain no other
# `*DATABASE_URL`, no content key, and no provider API token; it has no health
# route, so the probe is TCP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress
  namespace: fleet-recall
  labels:
    app: ingress
    fleet-recall.dev/phase: recall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress
  template:
    metadata:
      labels:
        app: ingress
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: ingress
          image: ostk-fleet-recall:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          args:
            - ingress
            - --sources
            - /etc/fleet-recall/ingress-sources.json
            - --listen
            - 0.0.0.0:8787
            - --allow-non-loopback
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: FLEET_RECALL_TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: fleet-env
                  key: FLEET_RECALL_TENANT_ID
            - name: FLEET_RECALL_PROJECT
              valueFrom:
                configMapKeyRef:
                  name: fleet-env
                  key: FLEET_RECALL_PROJECT
            - name: FLEET_RECALL_EMBEDDING_MODEL_PATH
              valueFrom:
                configMapKeyRef:
                  name: fleet-env
                  key: FLEET_RECALL_EMBEDDING_MODEL_PATH
            - name: FLEET_RECALL_EMBEDDING_MODEL_SHA256
              valueFrom:
                configMapKeyRef:
                  name: fleet-env
                  key: FLEET_RECALL_EMBEDDING_MODEL_SHA256
            - name: RUST_LOG
              value: ostk_fleet_recall=info
          envFrom:
            - secretRef:
                name: db-url-ingress
            - secretRef:
                name: ingress-slack
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
          volumeMounts:
            - name: sources
              mountPath: /etc/fleet-recall
              readOnly: true
            - name: model
              mountPath: /opt/ostk/models/potion-retrieval-32M
              readOnly: true
            - name: crdb-ca
              mountPath: /etc/crdb
              readOnly: true
      volumes:
        - name: sources
          configMap:
            name: fleet-sources
        - name: model
          hostPath:
            path: __MODEL_BUNDLE_DIR__
            type: Directory
        - name: crdb-ca
          secret:
            secretName: crdb-ca
---
apiVersion: v1
kind: Service
metadata:
  name: ingress
  namespace: fleet-recall
  labels:
    app: ingress
    fleet-recall.dev/phase: recall
spec:
  type: NodePort
  selector:
    app: ingress
  ports:
    - name: http
      port: 8787
      targetPort: http
      nodePort: 30787
