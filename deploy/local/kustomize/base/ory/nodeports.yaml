# Fixed NodePorts for the Helm-managed Ory pods, so Lima's static forwards
# have stable targets. Selectors match the charts' standard labels.
apiVersion: v1
kind: Service
metadata:
  name: hydra-nodeport
  namespace: ory
  labels:
    fleet-recall.dev/phase: ory-nodeports
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: hydra
    app.kubernetes.io/instance: hydra
  ports:
    - name: public
      port: 4444
      targetPort: 4444
      nodePort: 30444
    - name: admin
      port: 4445
      targetPort: 4445
      nodePort: 30445
---
apiVersion: v1
kind: Service
metadata:
  name: kratos-nodeport
  namespace: ory
  labels:
    fleet-recall.dev/phase: ory-nodeports
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kratos
    app.kubernetes.io/instance: kratos
  ports:
    - name: public
      port: 4433
      targetPort: 4433
      nodePort: 30433
---
apiVersion: v1
kind: Service
metadata:
  name: kratos-ui-nodeport
  namespace: ory
  labels:
    fleet-recall.dev/phase: ory-nodeports
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kratos-selfservice-ui-node
    app.kubernetes.io/instance: kratos-ui
  ports:
    - name: http
      port: 4455
      targetPort: 3000
      nodePort: 30455
