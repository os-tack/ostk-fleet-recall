apiVersion: v1
kind: Service
metadata:
  name: cockroach
  namespace: fleet-recall
  labels:
    app: cockroach
    fleet-recall.dev/phase: cockroach
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: cockroach
  ports:
    - name: sql
      port: 26257
      targetPort: sql
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: cockroach-public
  namespace: fleet-recall
  labels:
    app: cockroach
    fleet-recall.dev/phase: cockroach
spec:
  type: NodePort
  selector:
    app: cockroach
  ports:
    - name: sql
      port: 26257
      targetPort: sql
      nodePort: 30257
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
