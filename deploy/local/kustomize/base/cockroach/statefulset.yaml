# Secure single-node CockroachDB. The image entrypoint pins its listener to
# 127.0.0.1 and generates a localhost-only node certificate, so the binary is
# invoked directly with certificates generated by bootstrap.sh (SANs cover the
# in-cluster names and the Mac's loopback). Data lives on the node's disk.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cockroach
  namespace: fleet-recall
  labels:
    app: cockroach
    fleet-recall.dev/phase: cockroach
spec:
  serviceName: cockroach
  replicas: 1
  selector:
    matchLabels:
      app: cockroach
  template:
    metadata:
      labels:
        app: cockroach
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: cockroach
          image: cockroachdb/cockroach:v26.2.3
          imagePullPolicy: IfNotPresent
          command:
            - /cockroach/cockroach
            - start-single-node
            - --certs-dir=/cockroach/certs
            - --listen-addr=0.0.0.0:26257
            - --http-addr=0.0.0.0:8080
            - --advertise-addr=cockroach-0.cockroach.fleet-recall.svc.cluster.local:26257
            - --store=path=/cockroach/cockroach-data
            - --cache=512MiB
            - --max-sql-memory=512MiB
          ports:
            - name: sql
              containerPort: 26257
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health?ready=1
              port: http
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: certs
              mountPath: /cockroach/certs
              readOnly: true
            - name: data
              mountPath: /cockroach/cockroach-data
      volumes:
        - name: certs
          secret:
            secretName: crdb-node-certs
            defaultMode: 0400
        - name: data
          hostPath:
            path: /var/lib/fleet-recall/crdb
            type: DirectoryOrCreate
