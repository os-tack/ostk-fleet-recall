apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Stage the HTTPS edge, CA, and split DNS before applying phase=remote.
# Reuse the M3 enrollment, signing keys, spool, and database authority unchanged.
resources:
  - ../m2-remote-plane
patches:
  - path: recall.yaml
  - path: ory-services.yaml
  - path: worker.yaml
