apiVersion: apps/v1
kind: Deployment
metadata:
  name: recall
  namespace: fleet-recall
spec:
  template:
    spec:
      containers:
        - name: recall
          env:
            - {name: FLEET_RECALL_RESOURCE_URL, value: "https://recall.fleet.test:8443/mcp"}
            - {name: FLEET_RECALL_OIDC_ISSUERS, value: "hydra=https://auth.fleet.test:8443/,k8s=https://kubernetes.default.svc"}
            - name: FLEET_RECALL_OIDC_LOCAL_TRANSPORTS
              $patch: delete
            - {name: FLEET_RECALL_OIDC_CA_PATH, value: /etc/recall-oidc-ca/ca.pem}
          volumeMounts:
            - {name: oidc-ca, mountPath: /etc/recall-oidc-ca, readOnly: true}
      volumes:
        - name: oidc-ca
          configMap: {name: fleet-oidc-ca}
---
apiVersion: v1
kind: Service
metadata:
  name: recall
  namespace: fleet-recall
spec:
  type: ClusterIP
  ports:
    - name: mcp
      port: 8080
      targetPort: mcp
      nodePort: null
