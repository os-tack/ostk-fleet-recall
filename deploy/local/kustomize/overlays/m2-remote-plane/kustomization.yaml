apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Apply phase=remote only after M2 schema/policies and the M3 secrets exist.
# deploy/local/bin/deploy-sandbox-plane.py renders the local placeholders.
resources:
  - ../../base
  - remote.yaml
  - embed.yaml
  - spool.yaml
  - launcher.yaml
patches:
  - path: worker.yaml
