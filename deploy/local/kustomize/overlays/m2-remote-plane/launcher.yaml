apiVersion: v1
kind: ServiceAccount
metadata:
  name: launcher
  namespace: fleet-recall
  labels:
    fleet-recall.dev/phase: remote
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recall-oidc
  namespace: fleet-recall
  labels:
    fleet-recall.dev/phase: remote
automountServiceAccountToken: false
---
# The API disables anonymous authentication. This identity can read only OIDC
# discovery and verification keys, without access to Kubernetes API resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleet-issuer-discovery
  labels:
    fleet-recall.dev/phase: remote
rules:
  - nonResourceURLs: ["/.well-known/openid-configuration", "/openid/v1/jwks"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleet-issuer-discovery
  labels:
    fleet-recall.dev/phase: remote
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fleet-issuer-discovery
subjects:
  - kind: ServiceAccount
    name: recall-oidc
    namespace: fleet-recall
---
apiVersion: batch/v1
kind: Job
metadata:
  name: enroll-sandbox-__RUN_ID__
  namespace: fleet-recall
  labels:
    fleet-recall.dev/phase: remote-enroll
spec:
  # Applying identical declarations and scope bootstrap is idempotent. Retry
  # short service-routing gaps after the embedding Deployment becomes Ready.
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app: enrollment
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: enroll
          image: ostk-fleet-recall:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          args: [enroll, apply, --file, /etc/recall/registry.json, --bootstrap-scopes]
          envFrom:
            - secretRef: {name: db-url-enrollment}
          env:
            - {name: FLEET_RECALL_EMBEDDING_MODEL, value: minishlab/potion-retrieval-32M}
            - {name: FLEET_RECALL_EMBEDDING_MODEL_SHA256, value: __MODEL_SHA256__}
            - {name: FLEET_RECALL_EMBEDDING_TIER_URL, value: "http://embed:8090"}
            - name: FLEET_RECALL_EMBEDDING_TIER_TOKEN
              valueFrom:
                secretKeyRef: {name: fleet-remote, key: FLEET_RECALL_EMBEDDING_TIER_TOKEN}
          volumeMounts:
            - {name: crdb-ca, mountPath: /etc/crdb, readOnly: true}
            - {name: registry, mountPath: /etc/recall, readOnly: true}
      volumes:
        - name: crdb-ca
          secret: {secretName: crdb-ca}
        - name: registry
          configMap: {name: fleet-sandbox-registry}
