apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: https-default-deny-ingress
  namespace: fleet-edge
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: https-client-entrypoint
  namespace: fleet-edge
spec:
  podSelector:
    matchLabels: {fleet-recall.dev/component: https-edge}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8443, protocol: TCP}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: fleet-observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports: [{port: 9100, protocol: TCP}]
