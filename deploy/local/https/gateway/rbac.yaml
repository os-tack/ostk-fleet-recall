apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-edge
  namespace: fleet-edge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleet-edge-discovery
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleet-edge-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fleet-edge-discovery
subjects:
  - kind: ServiceAccount
    name: fleet-edge
    namespace: fleet-edge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-edge
  namespace: fleet-edge
rules:
  - apiGroups: [""]
    resources: [services, secrets, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes, grpcroutes, tlsroutes, referencegrants, backendtlspolicies]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways/status, httproutes/status, grpcroutes/status, tlsroutes/status, backendtlspolicies/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-edge
  namespace: fleet-edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-edge
subjects:
  - kind: ServiceAccount
    name: fleet-edge
    namespace: fleet-edge
