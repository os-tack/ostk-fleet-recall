apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: fleet-edge
  labels:
    fleet-recall.dev/component: https-edge
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: fleet-edge
  namespace: fleet-edge
spec:
  gatewayClassName: fleet-edge
  listeners:
    - name: https
      hostname: "*.fleet.test"
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: fleet-edge-tls
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
