apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: fleet-local-ca
spec:
  ca:
    secretName: fleet-intermediate-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fleet-edge
  namespace: fleet-edge
spec:
  secretName: fleet-edge-tls
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages: [digital signature, server auth]
  dnsNames: [auth.fleet.test, login.fleet.test, recall.fleet.test]
  issuerRef:
    name: fleet-local-ca
    kind: ClusterIssuer
    group: cert-manager.io
