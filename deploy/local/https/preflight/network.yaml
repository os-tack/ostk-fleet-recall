apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolated-identity-preflight
  namespace: fleet-https-preflight
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: fleet-edge}
          podSelector:
            matchLabels: {fleet-recall.dev/component: https-edge}
      ports:
        - {port: 4444, protocol: TCP}
        - {port: 4433, protocol: TCP}
        - {port: 3000, protocol: TCP}
    - from:
        - podSelector: {}
      ports:
        - {port: 4444, protocol: TCP}
        - {port: 4445, protocol: TCP}
        - {port: 4433, protocol: TCP}
        - {port: 4434, protocol: TCP}
        - {port: 3000, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: fleet-recall}
          podSelector:
            matchLabels: {app: cockroach}
      ports: [{port: 26257, protocol: TCP}]
    - to:
        - podSelector: {}
      ports:
        - {port: 4444, protocol: TCP}
        - {port: 4445, protocol: TCP}
        - {port: 4433, protocol: TCP}
        - {port: 4434, protocol: TCP}
        - {port: 3000, protocol: TCP}
