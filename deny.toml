[advisories]
# Cargo's facade lockfile records optional SQLx MySQL packages even though the
# Fleet binary enables PostgreSQL only. `cargo tree --target <deployment> -i
# rsa` is empty; keep this explicit until Cargo/auditing can prune inactive
# optional packages from lockfile audits.
ignore = [
    "RUSTSEC-2023-0071", # rsa via inactive sqlx-mysql; no fixed release
    # Both unmaintained crates are transitive through the pinned
    # model2vec-rs/tokenizers stack. They have no reported vulnerability and
    # no compatible safe upgrade; keep the exception visible until the
    # upstream embedding stack removes them.
    "RUSTSEC-2024-0436", # paste via tokenizers
    "RUSTSEC-2025-0119", # number_prefix via indicatif
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# SPDX licenses present in the locked, target-filtered runtime/development
# graph. This is an explicit review boundary rather than cargo-deny's
# deny-everything default; new licenses still fail CI until added here.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/os-tack/ostk-recall.git",
]
